<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1600px;height:940px;background:#f8fafc;font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#0f172a;padding:56px 72px}
h2{font-size:40px;font-weight:800}p.s{font-size:22px;color:#475569;margin-top:8px}
svg{margin-top:26px}
text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}
</style></head><body>
<h2>How much may the agent take on this ticket?</h2>
<p class="s">DelegationGate.decide(ticket): the rules run in this order, every ticket, every sprint.</p>
<svg width="1456" height="720" viewBox="0 0 1456 720">
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs>
<rect x="0" y="40" width="290" height="110" rx="16" fill="#fff" stroke="#334155" stroke-width="3"/>
<text x="145" y="90" font-size="28" font-weight="700" text-anchor="middle">Ticket</text>
<text x="145" y="124" font-size="18" fill="#475569" text-anchor="middle">skill · assignee · evidence</text>
<line x1="290" y1="95" x2="370" y2="95" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
<rect x="380" y="20" width="430" height="150" rx="16" fill="#fff" stroke="#334155" stroke-width="3"/>
<text x="595" y="70" font-size="26" font-weight="700" text-anchor="middle">1. Is this their agent-off rep?</text>
<text x="595" y="106" font-size="19" fill="#475569" text-anchor="middle">Windows of 4 tickets per junior; pick the</text>
<text x="595" y="132" font-size="19" fill="#475569" text-anchor="middle">skill with the fewest unassisted reps</text>
<line x1="810" y1="95" x2="1010" y2="95" stroke="#16a34a" stroke-width="3" marker-end="url(#ar)"/>
<text x="910" y="82" font-size="22" font-weight="700" fill="#16a34a" text-anchor="middle">yes</text>
<rect x="1020" y="30" width="410" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="1225" y="84" font-size="30" font-weight="800" fill="#15803d" text-anchor="middle">Agent off</text>
<text x="1225" y="120" font-size="20" fill="#166534" text-anchor="middle">junior works it unassisted</text>
<line x1="595" y1="170" x2="595" y2="270" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
<text x="615" y="228" font-size="22" font-weight="700" fill="#475569">no</text>
<rect x="380" y="280" width="430" height="150" rx="16" fill="#fff" stroke="#334155" stroke-width="3"/>
<text x="595" y="330" font-size="26" font-weight="700" text-anchor="middle">2. Did they design it first?</text>
<text x="595" y="366" font-size="19" fill="#475569" text-anchor="middle">a design note by the assignee AND</text>
<text x="595" y="392" font-size="19" fill="#475569" text-anchor="middle">failing tests that define "done"</text>
<line x1="810" y1="355" x2="1010" y2="355" stroke="#d97706" stroke-width="3" marker-end="url(#ar)"/>
<text x="910" y="342" font-size="22" font-weight="700" fill="#d97706" text-anchor="middle">missing</text>
<rect x="1020" y="275" width="410" height="160" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="1225" y="325" font-size="30" font-weight="800" fill="#b45309" text-anchor="middle">Tutor only</text>
<text x="1225" y="360" font-size="20" fill="#92400e" text-anchor="middle">Claude teaches in a TutorMode;</text>
<text x="1225" y="388" font-size="20" fill="#92400e" text-anchor="middle">TutorContract checks every reply</text>
<line x1="595" y1="430" x2="595" y2="530" stroke="#334155" stroke-width="3" marker-end="url(#ar)"/>
<text x="615" y="488" font-size="22" font-weight="700" fill="#475569">both present</text>
<rect x="380" y="540" width="430" height="130" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="595" y="594" font-size="30" font-weight="800" fill="#1d4ed8" text-anchor="middle">Agent writes</text>
<text x="595" y="630" font-size="20" fill="#1e40af" text-anchor="middle">against the junior's own tests</text>
<rect x="1020" y="500" width="410" height="200" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1046" y="540" font-size="20" font-weight="700" fill="#334155">TutorContract fails a reply that:</text>
<text x="1046" y="578" font-size="19" fill="#475569">• writes more code than the mode allows</text>
<text x="1046" y="612" font-size="19" fill="#475569">• never hands a question back</text>
<text x="1046" y="646" font-size="19" fill="#475569">• doesn't cite a real line (point-at-line)</text>
<line x1="1225" y1="435" x2="1225" y2="492" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="20" y="712" font-size="18" fill="#64748b">Rotation is checked first on purpose: a quick design note can't skip a rep.</text>
</svg></body></html>
